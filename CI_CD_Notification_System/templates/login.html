{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="form-card">
  <p class="eyebrow">WELCOME BACK</p><h1>Sign in</h1>
  <form method="POST">
    <label>Email address</label><input type="email" name="email" required autocomplete="email">
    <label>Password</label><input type="password" name="password" required autocomplete="current-password">
    <button class="button primary full" type="submit">Login</button>
  </form>
  <p class="form-note">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
